global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "k3s"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    static_configs:
      - targets: ["kubernetes.default.svc:443"]
    metrics_path: /api/v1/nodes/devops/proxy/metrics

  - job_name: "kubelet"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    static_configs:
      - targets: ["kubernetes.default.svc:443"]
    metrics_path: /api/v1/nodes/devops/proxy/metrics/cadvisor

  - job_name: "flask-app"
    static_configs:
      - targets: ["lab-app.dev.svc:80"]
