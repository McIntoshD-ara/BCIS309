# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./k8s-demo
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest test_app.py -v

      - name: Build Docker image
        run: docker build -t k8s-demo:${{ github.sha }} .

      - name: Save image as artefact
        run: docker save k8s-demo:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ github.sha }}
          path: ./k8s-demo/image.tar.gz

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./k8s-demo/
          push: true
          tags: |
            ghcr.io/mcintoshd-ara/bcis309:latest
            ghcr.io/mcintoshd-ara/bcis309:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6

      - name: Apply manifests
        run: |
          kubectl apply -f k8s-demo/k8s/dev/namespace.yaml
          kubectl apply -f k8s-demo/k8s/dev/deployment.yaml
          kubectl apply -f k8s-demo/k8s/dev/service.yaml

      - name: Update image to latest commit
        run: |
          kubectl set image deployment/k8s-demo \
            k8s-demo=ghcr.io/mcintoshd-ara/bcis309:${{ github.sha }} \
            -n dev

      - name: Wait for rollout
        run: kubectl rollout status deployment/k8s-demo -n dev

      - name: Show running pods
        run: kubectl get pods -n dev
